[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sysml-codegen"
version = "0.1.1"
description = "SysML v2 to Python code generation framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Reid", email = "reid@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "agentic-mbse>=0.1.3,<0.2",
    "jinja2>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "jsonschema>=4.0",
]

[project.scripts]
sysml-codegen = "sysml_codegen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sysml_codegen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m \"not execution\""
markers = [
    "req(id): map test to requirement ID (e.g., REQ-SNAP-01)",
    "execution: real-simkit execution lane (Item 7 Phase 4) — needs the agentic-mbse venv with teax-simkit on sys.path; excluded from the default run, invoke with `pytest -m execution` (or override -m entirely) from that environment.",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

# The eight study modules ported byte-faithfully from fusion-tea b06585709. Annotating them
# is a byte change the move keeps out, so their untyped defs are allowed. The new study
# modules (roots, census, declarations) are fully typed and carry no override.
[[tool.mypy.overrides]]
module = [
    "sysml_codegen.study.common",
    "sysml_codegen.study.identity",
    "sysml_codegen.study.indicators",
    "sysml_codegen.study.integrate",
    "sysml_codegen.study.manifest",
    "sysml_codegen.study.preflight",
    "sysml_codegen.study.read_coverage",
    "sysml_codegen.study.verify",
]
disallow_untyped_defs = false

# The type looseness each ported module carries as written, by error code. Recorded per
# module, so code later added to one of them is still checked for every other code.
[[tool.mypy.overrides]]
module = "sysml_codegen.study.identity"
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = "sysml_codegen.study.indicators"
disable_error_code = ["arg-type", "no-any-return"]

[[tool.mypy.overrides]]
module = "sysml_codegen.study.integrate"
disable_error_code = ["index", "no-any-return"]

[[tool.mypy.overrides]]
module = "sysml_codegen.study.manifest"
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = "sysml_codegen.study.preflight"
disable_error_code = ["arg-type", "assignment", "attr-defined"]

[[tool.mypy.overrides]]
module = "sysml_codegen.study.verify"
disable_error_code = ["index"]

# Third-party modules the study tools import that ship no type information. teax's simkit
# is an optional runtime, imported lazily.
[[tool.mypy.overrides]]
module = ["simkit", "simkit.*", "yaml"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]

# Ported byte-faithfully from fusion-tea b06585709, which held them to no line length and
# named two exceptions without an Error suffix. Reformatting is a byte change the move keeps
# out; the new study modules carry no ignore.
[tool.ruff.lint.per-file-ignores]
"src/sysml_codegen/study/integrate.py" = ["E501", "N818"]
"src/sysml_codegen/study/preflight.py" = ["N818"]
"src/sysml_codegen/study/read_coverage.py" = ["E501"]
"src/sysml_codegen/study/verify.py" = ["E501"]

[tool.uv.sources]
agentic-mbse = { path = "../agentic-mbse", editable = true }
